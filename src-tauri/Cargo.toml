[package]
name = "mathventure"
version = "0.1.0"
description = "MathVenture offline classroom app"
authors = ["MathVenture"]
edition = "2021"

[lib]
name = "mathventure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1" }

[dependencies]
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.1" }
tauri-plugin-sql = { version = "2.3.1", features = ["sqlite"] }
thiserror = "2"
